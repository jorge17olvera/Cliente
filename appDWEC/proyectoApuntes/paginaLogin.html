<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Plataforma Educativa</title>
    <style>
    :root {
        --primary-color: #4f46e5;
        --primary-hover: #4338ca;
        --bg-color: #f3f4f6;
        --text-color: #1f2937;
        --border-color: #d1d5db;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
        background-color: var(--bg-color);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: var(--text-color);
    }

    .login-container {
        background-color: white;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 400px;
    }

    .login-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .login-header h1 {
        font-size: 1.5rem;
        color: #111827;
        margin-bottom: 0.5rem;
    }

    .login-header p {
        color: #6b7280;
        font-size: 0.875rem;
    }

    /* Adaptado a tus nuevas clases divCodigo y divClave */
    .divCodigo, .divClave {
        margin-bottom: 1.5rem;
    }

    .divCodigo label, .divClave label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
        color: #374151;
    }

    .divCodigo input, .divClave input {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 1rem;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .divCodigo input:focus, .divClave input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    /* Estilos para el mensaje de error específico que has creado */
    #error {
        background-color: #fee2e2;
        color: #991b1b;
        border: 1px solid #f87171;
        padding: 0.75rem;
        border-radius: 6px;
        text-align: center;
        font-size: 0.875rem;
        margin-bottom: 1.5rem; /* Para separarlo del botón */
    }

    /* Clase para ocultar elementos. ¡Muy útil en JavaScript! */
    .oculto {
        display: none !important;
    }

    /* Adaptado al ID de tu nuevo botón */
    #botonEnviar {
        width: 100%;
        padding: 0.75rem;
        background-color: var(--primary-color);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
    }

    #botonEnviar:hover {
        background-color: var(--primary-hover);
    }
</style>
    <script src="./js/paginaLogin.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Bienvenido</h1>
            <p>Ingresa tu código y clave para acceder</p>
        </div>

        <form id="formularioInicioSesion">
            <div class="divCodigo">
                <label for="codigo">Código de Usuario</label>
                <input type="text" id="codigo" name="codigo" placeholder="usuario" required>
            </div>

            <div class="divClave">
                <label for="clave">Clave</label>
                <input type="password" id="clave" name="clave" placeholder="••••••••" required>
            </div>

            <div id="error" class="oculto">El usuario/contraseña incorrecta</div>

            <button type="button" id="botonEnviar">Iniciar Sesión</button>
        </form>

        
    </div>
</body>
</html>
