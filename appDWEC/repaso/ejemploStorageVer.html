<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        onload=pintarTabla;
        

        function pintarTabla() {
            let listaCitas = [];
            if (sessionStorage.getItem("citas")) {
                listaCitas = JSON.parse(sessionStorage.getItem("citas"));
            }

        let tbody=document.getElementsByTagName("tbody")[0];

        listaCitas.forEach(cita => {
            let tr=document.createElement("tr");
            
            tbody.appendChild(tr);
            let nombre=cita.nombre;
            let tdNombre=document.createElement("td");
            tdNombre.innerText=nombre;
            tr.appendChild(tdNombre);

            let tdDesc=document.createElement("td");
            tdDesc.innerText=cita.descripcion;
            tr.appendChild(tdDesc);

            let tdDia=document.createElement("td");
            tdDia.innerText=cita.dia;
            tr.appendChild(tdDia);

            let tdHora=document.createElement("td");
            tdHora.innerText=cita.hora;
            tr.appendChild(tdHora);
            
        });
        }
        
    </script>
</head>
<body>
    <table>
        <thead>
            <th>Nombre</th>
            <th>Descripcion</th>
            <th>Dia</th>
            <th>Hora</th>
        </thead>
        <tbody>

        </tbody>
    </table>
</body>
</html>
